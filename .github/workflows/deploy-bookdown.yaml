on:
  push:
    branches:
      - main
      - master

name: renderbook

jobs:
  bookdown:
    name: Render-Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install rmarkdown and deps
        run: Rscript -e 'install.packages(c("rmarkdown", "bookdown", "svglite", "tinytex", "kableExtra", "ggpubr", "tidyverse", "zoo", "latex2exp")); tinytex::install_tinytex(force = TRUE);tinytex::tlmgr_install(c("bibtex", "graphics"))'
      - name: Render Book
        run: make
      - uses: actions/upload-artifact@v5
        with:
          name: _book
          path: _book/
          include-hidden-files: true

# Need to first create an empty gh-pages branch
# see https://pkgdown.r-lib.org/reference/deploy_site_github.html
# Publishes _book/ to gh-pages using the built-in GITHUB_TOKEN (no PAT secret needed).
  checkout-and-deploy:
   runs-on: ubuntu-latest
   needs: bookdown
   permissions:
     contents: write
   steps:
     - name: Download artifact
       uses: actions/download-artifact@v5
       with:
         # Artifact name
         name: _book # optional
         # Destination path
         path: _book # optional
     - name: Deploy to GitHub Pages
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         set -euo pipefail
         test -n "$(ls -A _book)" || { echo "_book is empty, nothing to deploy"; exit 1; }
         cd _book
         touch .nojekyll
         git init -q -b gh-pages
         git config user.name "Henri"
         git config user.email "Henri.Funk@stat.uni-muenchen.de"
         git add -A
         git commit -q -m "Deploy book from ${GITHUB_SHA} [ci skip]"
         git push -q --force \
           "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
           gh-pages
