[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# src layout: `downscaling` is the library, `plot_diffusion_process` the diagnostic scripts
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D103", "D104", "INP001", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project]
name = "climate-seminar-diffusion-downscaling"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "cartopy>=0.25.0",
    "matplotlib>=3.10.9",
    "netcdf4>=1.7.4",       # xarray engine="netcdf4"
    "pandas>=3.0.3",
    "pyproj>=3.7.0",        # data_prep/coarsen_cerra.py
    "scipy>=1.17.1",
    "torch>=2.0.0",
    "tqdm>=4.67.0",
    "wandb>=0.27.2",
    "xarray>=2026.4.0",
]
