[project]
name = "drought-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "hydra-core>=1.3.2",
    "invoke>=3.0.3",
    "matplotlib>=3.10.9",
    "netcdf4>=1.7.4",
    "pytorch-lightning>=2.6.5",
    "ruff>=0.15.14",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "wandb>=0.27.0",
    "xarray>=2026.4.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (PEP8)
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
]
