defaults:
  - data: default
  - model: default
  - trainer: default
  - logger: wandb   # switch to CSV with: logger=csv
  - _self_

seed: 42
checkpoints_dir: ${hydra:runtime.cwd}/checkpoints
saved_models_dir: ${hydra:runtime.cwd}/saved_models
figures_dir: ${hydra:runtime.cwd}/figures/models
# Optional: set to override the auto-generated model filename (without .ckpt extension).
# If empty, a name is derived from the model config (e.g. best_model_pinball_q0.10).
run_name: ""

# Evaluation-only mode: skip training, load checkpoint, run test + save figures.
eval_only: false
eval_checkpoint: ""