defaults:
  - data: default
  - model: default
  - trainer: default
  - logger: wandb   # switch to CSV with: logger=csv
  - _self_

seed: 42
phase: 0   # 0 = untracked manual run; 1 = phase1 loss grid; 2 = phase2 arch sweep
checkpoints_dir: ${hydra:runtime.cwd}/checkpoints_v2
saved_models_dir: ${hydra:runtime.cwd}/saved_models_v2
figures_dir: ${hydra:runtime.cwd}/figures_v2/models
# Optional: set to override the auto-generated model filename (without .ckpt extension).
# If empty, a name is derived from the model config (e.g. best_model_pinball_q0.10).
run_name: ""

# Evaluation-only mode: skip training, load checkpoint, run test + save figures.
eval_only: false
eval_checkpoint: ""