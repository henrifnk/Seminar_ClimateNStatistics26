# ──────────────────────────────────────────────────────────────────────────────
# RQ3 — Local model trained FROM SCRATCH on the single target basin only using EA-LSTM.
# Same architecture as the global base (ealstm, hidden=64) for a fair compare.
# This is the baseline that "global pretrain + finetune" must beat.
# ──────────────────────────────────────────────────────────────────────────────

experiment_name: rq3_scratch_local_ea

train_basin_file: C:/GitHub/climate-change/NeuralHydrology/rq3_finetune/basins_finetune.txt
validation_basin_file: C:/GitHub/climate-change/NeuralHydrology/rq3_finetune/basins_finetune.txt
test_basin_file: C:/GitHub/climate-change/NeuralHydrology/rq3_finetune/basins_finetune.txt

train_start_date: "01/10/1999"
train_end_date: "30/09/2008"
validation_start_date: "01/10/1980"
validation_end_date: "30/09/1989"
test_start_date: "01/10/1989"
test_end_date: "30/09/1999"

device: cpu

validate_every: 5
validate_n_random_basins: 1
metrics:
  - NSE
  - KGE

# ─── Model (identical to pretrain_ea.yml) ────────────────────────────────────────
model: ealstm
head: regression
output_activation: linear
hidden_size: 64
initial_forget_bias: 3
output_dropout: 0.4

# ─── Training ─────────────────────────────────────────────────────────────────
optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-3
  15: 5e-4
  25: 1e-4
batch_size: 256
epochs: 30
clip_gradient_norm: 1
predict_last_n: 1
seq_length: 365
num_workers: 0
log_interval: 5
log_tensorboard: false
save_weights_every: 1
save_validation_results: true

# ─── Data ─────────────────────────────────────────────────────────────────────
dataset: camels_us
data_dir: C:/GitHub/climate-change/NeuralHydrology/data/CAMELS_US

forcings:
  - daymet

dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)

# No static_attributes: for a single-basin model they are constant (std=0) and
# carry no information, so the local-from-scratch model uses dynamic inputs only.
static_attributes: []

target_variables:
  - QObs(mm/d)

clip_targets_to_zero:
  - QObs(mm/d)
